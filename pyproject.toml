[project]
name = "cognion"
version = "0.1.0"
description = "Plataforma de cuestionarios para facultades de ingeniería"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "PyJWT[crypto]>=2.8.0",
    "bcrypt>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=13.0",
    "certifi>=2024.0.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pylint>=3.0.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "quality-agents",
    "vulture>=2.16",
    "codespell>=2.4.3",
    "import-linter>=2.0",
]

[tool.uv.sources]
quality-agents = { git = "https://github.com/vvalotto/software_limpio" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Formatters / Linters
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "D"]
# E501: line-length ya cubierto por black/max-line-length.
# N818: excepciones de dominio nombradas en lenguaje de negocio (EmailYaRegistrado,
# UsuarioNoEsDocente) tal como las especifica docs/specs/ — no se les agrega sufijo "Error".
ignore = ["E501", "N818"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# __init__.py vacíos de los BC aún no implementados: no se agregan docstrings artificiales.
"**/__init__.py" = ["D104", "D100"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "happy-path: escenario BDD de flujo exitoso",
    "error: escenario BDD de rechazo/error",
    "US-1.1.0: escenarios BDD de la US-1.1.0",
    "US-1.1.1: escenarios BDD de la US-1.1.1",
    "alta-usuario: escenario BDD de alta de Usuario",
    "alta-comision: escenario BDD de alta de Comisión",
    "asignacion-docente: escenario BDD de asignación de Docente a Comisión",
    "generar-invitacion: escenario BDD de generación de invitación",
    "registro-estudiante: escenario BDD de registro de Estudiante vía invitación",
    "US-1.1.2: escenarios BDD de la US-1.1.2",
    "US-1.1.3: escenarios BDD de la US-1.1.3",
    "ux: escenario BDD de UI — pendiente hasta que exista infraestructura de frontend (routing/cliente API)",
    "US-2.1.1: escenarios BDD de la US-2.1.1",
    "crear-materia: escenario BDD de alta de Materia y Banco",
    "edge-case: escenario BDD de caso límite (colecciones vacías, etc.)",
    "integration: escenario BDD que verifica integración real entre componentes",
    "US-5.1.1: escenarios BDD de la US-5.1.1",
    "US-8.7.1: escenarios BDD de la US-8.7.1",
    "carga: escenario BDD de carga de datos iniciales",
    "idempotencia: escenario BDD de repetición sin duplicados",
    "validacion: escenario BDD de rechazo por datos inválidos",
    "invariante: escenario BDD que verifica una invariante de dominio",
    "carpeta: escenario BDD que procesa una carpeta de archivos",
    "aislamiento: escenario BDD de aislamiento entre archivos",
    "simular: escenario BDD del modo --simular",
    "materia-existente: escenario BDD sobre una materia ya creada",
    "errores-entrada: escenario BDD de entrada inválida",
    "markdown: escenario BDD de cuestionarios en formato Markdown",
    "US-ADJ-64: escenarios BDD de la US-ADJ-64",
    "consola: escenario BDD del modo consola de emails",
    "tokens: escenario BDD de enmascarado de tokens en el log",
    "regresion: escenario BDD de no regresión",
    "configuracion: escenario BDD de configuración",
    "US-ADJ-65: escenarios BDD de la US-ADJ-65",
    "confirmacion: escenario BDD de la confirmación de contraseña",
    "US-ADJ-66: escenarios BDD de la US-ADJ-66",
    "certificado: escenario BDD de la validación del certificado del servidor SMTP",
    "cuenta-por-materia: escenario BDD de cuentas SMTP por materia",
    "sin-regresion: escenario BDD que verifica que lo existente no cambia",
    "observabilidad: escenario BDD de registro de errores en el log",
    "US-ADJ-63: escenarios BDD de la US-ADJ-63",
    "US-ADJ-68: escenarios BDD de la US-ADJ-68",
    "rendimiento: escenario BDD de rendimiento (el event loop no se bloquea)",
    "compatibilidad: escenario BDD de compatibilidad con lo ya guardado",
    "funcional: escenario BDD que verifica que el comportamiento funcional no cambia",
    "guarda: escenario BDD que actúa como guarda contra regresiones de diseño",
    "token-en-ruta: escenario BDD del enmascarado de un token en la ruta del log",
    "borde: escenario BDD de caso borde",
    "US-8.3.4: escenarios BDD de la US-8.3.4",
    "downgrade: escenario BDD que deshace migraciones de la base",
    "paso-a-paso: escenario BDD que deshace una migración por vez",
    "US-ADJ-69: escenarios BDD de la US-ADJ-69",
    "aviso: escenario BDD del aviso de intentos restantes del login",
    "contador: escenario BDD del contador de intentos fallidos",
    "seguridad: escenario BDD de un comportamiento que no debe filtrar información",
    "ultimo-administrador: escenario BDD del último Administrador operativo",
    "US-ADJ-67: escenarios BDD de la US-ADJ-67",
    "grupal: escenario BDD del link de invitación grupal",
    "duracion: escenario BDD de las duraciones elegibles del link",
    "autorizacion: escenario BDD de permisos del Docente sobre su comisión",
    "concurrencia: escenario BDD de registros simultáneos",
    "vencimiento: escenario BDD del vencimiento de un link",
    "desactivar: escenario BDD de la desactivación de un link",
    "un-solo-vigente: escenario BDD de un único link grupal vigente por comisión",
    "consulta: escenario BDD de la consulta del último link grupal",
    "registro: escenario BDD del registro de un estudiante con una invitación",    "US-8.3.3: escenarios BDD de la US-8.3.3",
    "salud: escenario BDD de los healthchecks de vida y de readiness",
    "autenticacion: escenario BDD de endpoints que no piden credenciales",
    "logs: escenario BDD del formato de los logs",
    "json: escenario BDD del formato de log JSON",
    "operacion: escenario BDD de los scripts de operación",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/*/frameworks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

# ---------------------------------------------------------------------------
# Quality agents (software_limpio)
# Umbrales calibrados para Clean Architecture — no usar defaults del sistema
# (CBO=5/WMC=20 genéricos producen falsos positivos en Use Cases que orquestan
# múltiples Entities). Recalibrar al inicio de cada Incremento si el aggregate
# principal crece significativamente.
# ---------------------------------------------------------------------------

[tool.codeguard]
min_pylint_score = 8.0
check_complexity = true
max_cyclomatic_complexity = 10

[tool.designreviewer]
max_cbo = 10
max_wmc = 25
max_god_object_lines = 300
max_god_object_methods = 15
paths = ["src"]

[tool.architectanalyst]
db_path = "quality/reports/architectanalyst/history.db"
coverage_report_path = "../coverage.json"

# Formato real de LayersConfig.rules: nombre de capa -> lista de nombres de capa permitidos
# (no globs de ruta). No detecta violaciones hoy por un bug de DependencyGraphBuilder
# (vvalotto/software_limpio, Issue pendiente — CLAUDE.md, nota de US-ADJ-19) — se deja en el
# formato correcto para cuando se resuelva upstream, en vez del formato inválido anterior.
[tool.architectanalyst.layers]
entities = []
use_cases = ["entities"]
interface_adapters = ["use_cases", "entities"]
frameworks = ["interface_adapters", "use_cases", "entities"]

# Guarda de arquitectura (Issue #497, `ADR-006`, `ADR-026`): hace cumplir en el CI lo que hasta ahora solo
# sostenía la revisión humana, porque `LayerViolationsAnalyzer` no es confiable (`software_limpio#77`).
# Se corre con `uv run lint-imports`.
[tool.importlinter]
root_package = "src"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Capas dentro de cada BC: entities <- use_cases <- interface_adapters <- frameworks"
type = "layers"
containers = [
    "src.identidad",
    "src.actividad_evaluativa",
    "src.banco_preguntas",
    "src.notificaciones",
    "src.analytics",
    "src.shared",
]
layers = [
    "(frameworks)",
    "(interface_adapters)",
    "(use_cases)",
    "(entities)",
]
# Excepción documentada (decisión de Víctor, 2026-11-08): los repositorios SQLAlchemy viven en
# `interface_adapters/gateways/` pero sus modelos ORM viven en `frameworks/db/models.py`. Es la
# convención del proyecto desde el Incremento 1 (9 archivos: identidad y banco_preguntas); la regla
# escrita se corrigió en `CLAUDE.md`. Cualquier otro import hacia una capa externa sigue prohibido.
ignore_imports = [
    "src.*.interface_adapters.gateways.** -> src.*.frameworks.db.models",
]

[[tool.importlinter.contracts]]
name = "Aislamiento entre BC: solo frameworks/adapters puede importar de otro BC (ADR-006)"
type = "independence"
modules = [
    "src.identidad",
    "src.actividad_evaluativa",
    "src.banco_preguntas",
    "src.notificaciones",
    "src.analytics",
]
ignore_imports = [
    "src.*.frameworks.adapters.** -> src.**",
]

[[tool.importlinter.contracts]]
name = "shared no importa de ningún BC"
type = "forbidden"
source_modules = ["src.shared"]
forbidden_modules = [
    "src.identidad",
    "src.actividad_evaluativa",
    "src.banco_preguntas",
    "src.notificaciones",
    "src.analytics",
]

# `ADR-026`: solo los adaptadores de lectura de Analytics pueden leer los modelos ORM de otro BC. Tres
# adaptadores lo hacen hoy sin ser de Analytics y se migran en la Iteración 4 del Incremento 9 (#600,
# #601 y #602): hasta entonces figuran como excepciones puntuales; al migrar cada uno se borra su línea.
[[tool.importlinter.contracts]]
name = "ADR-026: ningún BC salvo Analytics lee los modelos ORM de otro BC"
type = "forbidden"
source_modules = [
    "src.identidad",
    "src.actividad_evaluativa",
    "src.banco_preguntas",
    "src.notificaciones",
]
forbidden_modules = [
    "src.identidad.frameworks.db.models",
    "src.actividad_evaluativa.frameworks.db.models",
    "src.banco_preguntas.frameworks.db.models",
]
allow_indirect_imports = true
ignore_imports = [
    # Cada BC puede importar sus propios modelos.
    "src.identidad.** -> src.identidad.frameworks.db.models",
    "src.actividad_evaluativa.** -> src.actividad_evaluativa.frameworks.db.models",
    "src.banco_preguntas.** -> src.banco_preguntas.frameworks.db.models",
    # Pendientes de migrar (ADR-026, Iteración 4):
]
