# Composición para instalar Cognión en un servidor Linux con Docker (US-10.2.2).
# Tres servicios: PostgreSQL, la aplicación (imagen publicada por el CD) y Caddy (HTTPS automático).
# Solo Caddy publica puertos (80/443 por defecto); la base y la aplicación quedan en la red interna.
# Memoria y puertos se ajustan desde el .env (COGNION_MEM_DB, COGNION_MEM_APP, COGNION_HTTP_PORT, COGNION_HTTPS_PORT):
# los valores por defecto sirven para un servidor chico; un servidor compartido puede tener ya algo en el 80 y el 443.
name: cognion

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: ${COGNION_MEM_DB:-1g}
    environment:
      POSTGRES_USER: cognion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cognion
    # Con NullPool (ADR-018) cada operación abre una conexión: con 60 alumnos a la vez puede haber ~60 simultáneas,
    # por eso max_connections=100. El resto de los parámetros queda en los valores por defecto de PostgreSQL.
    command:
      - postgres
      - -c
      - max_connections=100
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognion -d cognion"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    image: ${COGNION_IMAGE}
    restart: unless-stopped
    mem_limit: ${COGNION_MEM_APP:-1g}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 64m
    environment:
      COGNION_DOMINIO: ${COGNION_DOMINIO}
    ports:
      - "${COGNION_HTTP_PORT:-80}:80"
      - "${COGNION_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
