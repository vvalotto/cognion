name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

jobs:
  build-and-deploy:
    name: Build, publicación y healthcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Solo se usa al publicar la imagen en GHCR con una etiqueta (US-8.6.4)
      packages: write
    env:
      IMAGEN: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      # El tag manda (US-10.2.1): no se publica una imagen `vX.Y.Z` cuyo archivo VERSION diga otra cosa.
      - name: Verificar que el tag coincide con VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_ARCHIVO="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION_ARCHIVO" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con VERSION ($VERSION_ARCHIVO)."
            exit 1
          fi

      - name: Set up Node (frontend build)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # En main solo se construye (verifica que la imagen compila). Con una etiqueta vX.Y.Z se publica en GHCR
      # (US-8.6.4, ADR-025). La etiqueta `org.opencontainers.image.source` liga el paquete a este repositorio.
      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t cognion:${{ github.sha }} .

      - name: Iniciar sesión en GHCR (solo etiquetas)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar la imagen en GHCR (solo etiquetas)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag cognion:${{ github.sha }} "$IMAGEN:${{ github.ref_name }}"
          docker tag cognion:${{ github.sha }} "$IMAGEN:sha-${{ github.sha }}"
          docker push "$IMAGEN:${{ github.ref_name }}"
          docker push "$IMAGEN:sha-${{ github.sha }}"
          echo "Imagen publicada: $IMAGEN:${{ github.ref_name }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Migraciones de base de datos — alembic upgrade head corre ANTES del deploy,
      # no dentro del build de la imagen (ver PLAN-CM.md §11).
      # Requiere DATABASE_URL disponible como secret.
      # - name: Run migrations
      #   run: docker run --rm -e DATABASE_URL=${{ secrets.DATABASE_URL }} cognion:${{ github.sha }} uv run alembic upgrade head

      # Deploy a Fly.io — infraestructura de producción pendiente de decisión (ARQ_v1.md).
      # Descomentar cuando esté definida y configurado FLY_API_TOKEN en los secrets del repo.
      # - name: Deploy a Fly.io
      #   uses: superfly/flyctl-actions/setup-flyctl@master
      # - run: flyctl deploy --remote-only
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Healthcheck post-deploy
      # - name: Healthcheck
      #   run: |
      #     sleep 10
      #     curl --fail https://<app>.fly.dev/health

      - name: Confirmar build exitoso
        run: echo "Imagen cognion:${{ github.sha }} construida. El despliegue en la VM es manual con deploy/gcp/desplegar.sh."

  # GitHub Release con las notas del CHANGELOG y el paquete de instalación (US-10.2.1). Solo en tags, y solo si la
  # imagen se publicó bien. La lógica vive en scripts/ (probados); el workflow únicamente los invoca.
  release:
    name: GitHub Release
    needs: build-and-deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Notas y paquete de instalación
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/extraer_notas.sh "$VERSION" > notas.md
          echo "PAQUETE=$(scripts/empaquetar_release.sh "$VERSION")" >> "$GITHUB_ENV"

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PAQUETE" \
            --title "Cognión $GITHUB_REF_NAME" --notes-file notas.md --verify-tag
