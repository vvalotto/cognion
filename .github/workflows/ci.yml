name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # Decide si el cambio exige el CI completo. Los cuatro checks obligatorios de `develop` (Lint backend, Lint frontend,
  # Tests y DesignReviewer) se saltean SOLO si un PR toca únicamente documentación que ningún test lee
  # (`scripts/ci/alcance_cambio.sh`). Un job salteado por `if` cuenta como aprobado para la protección de la rama.
  # Ante cualquier falla de este job, o un push, corre todo.
  alcance:
    name: Alcance del cambio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      completo: ${{ steps.decidir.outputs.completo }}
    steps:
      - uses: actions/checkout@v7

      - name: Decidir si hace falta el CI completo
        id: decidir
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "completo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            -q '.[] | .filename, (.previous_filename // empty)' > archivos.txt
          echo "Archivos del PR:"; cat archivos.txt
          scripts/ci/alcance_cambio.sh < archivos.txt | tee -a "$GITHUB_OUTPUT"

  lint-backend:
    name: Lint backend
    needs: alcance
    if: ${{ always() && (needs.alcance.result != 'success' || needs.alcance.outputs.completo == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: ruff
        run: uv run ruff check src/

      - name: mypy
        run: uv run mypy src/

      - name: import-linter (capas y aislamiento entre BC)
        run: uv run lint-imports

  lint-frontend:
    name: Lint frontend
    needs: alcance
    if: ${{ always() && (needs.alcance.result != 'success' || needs.alcance.outputs.completo == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Vitest
        run: npm run test
        working-directory: frontend

  test:
    name: Tests
    needs: alcance
    if: ${{ always() && (needs.alcance.result != 'success' || needs.alcance.outputs.completo == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cognion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/cognion
      SECRET_KEY: ci-secret-key-solo-para-pipeline-no-usar-en-otro-entorno
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest --cov=src --cov-report=term-missing

  design-review:
    name: DesignReviewer
    needs: alcance
    if: ${{ always() && (needs.alcance.result != 'success' || needs.alcance.outputs.completo == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: DesignReviewer
        run: uv run designreviewer src/ --config pyproject.toml
